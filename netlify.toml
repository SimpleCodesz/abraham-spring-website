[build]
  publish = "."

# Redirect Netlify subdomain to custom domain
[[redirects]]
  from = "https://whimsical-gumdrop-e0adcb.netlify.app/*"
  to = "https://abrahamspring.co.uk/:splat"
  status = 301
  force = true

# Clean URL redirects
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/podcast"
  to = "/podcast.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

# Legacy sales/membership URLs → research questionnaire (must come before SPA catch-all)
[[redirects]]
  from = "/pricing"
  to = "/#research"
  status = 301

[[redirects]]
  from = "/membership"
  to = "/#research"
  status = 301

[[redirects]]
  from = "/apply"
  to = "/#research"
  status = 301

[[redirects]]
  from = "/apply-form"
  to = "/#research"
  status = 301

# SPA catch-all — serve index.html for all section paths, keep clean URL
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Force fresh favicon (no long cache)
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
