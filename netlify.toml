[build]
  publish = "."

# Redirect Netlify subdomain to custom domain
[[redirects]]
  from = "https://whimsical-gumdrop-e0adcb.netlify.app/*"
  to = "https://abrahamspring.co.uk/:splat"
  status = 301
  force = true

# Clean URL redirects
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/podcast"
  to = "/podcast.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

[[redirects]]
  from = "/live-coaching"
  to = "/live-coaching.html"
  status = 200

[[redirects]]
  from = "/executive-burnout-coaching"
  to = "/executive-burnout-coaching.html"
  status = 200

[[redirects]]
  from = "/coaching-for-parents"
  to = "/coaching-for-parents.html"
  status = 200

[[redirects]]
  from = "/athlete-consistency"
  to = "/athlete-consistency.html"
  status = 200

[[redirects]]
  from = "/high-performer-burnout"
  to = "/high-performer-burnout.html"
  status = 200

# Legacy sales/membership URLs → research questionnaire (must come before SPA catch-all)
[[redirects]]
  from = "/pricing"
  to = "/#research"
  status = 301

[[redirects]]
  from = "/membership"
  to = "/#research"
  status = 301

[[redirects]]
  from = "/apply"
  to = "/#research"
  status = 301

[[redirects]]
  from = "/apply-form"
  to = "/#research"
  status = 301

# ── Duplicate blog posts → canonical home on unbrokenclub.com ──────────
# These 6 posts also live on unbrokenclub.com. To stop the two sites
# competing in Google ("alternate page with proper canonical tag") and to
# consolidate authority on unbrokenclub.com, 301 each duplicate (both the
# clean and .html URL) to its unbrokenclub.com version. force=true so the
# redirect wins over the local file. Unique posts (it-band-syndrome,
# running-biomechanics-assessment, training-with-chronic-pain) are left alone.
[[redirects]]
  from = "/blog/adhd-system-not-flaw"
  to = "https://unbrokenclub.com/blog/adhd-system-not-flaw.html"
  status = 301
  force = true
[[redirects]]
  from = "/blog/adhd-system-not-flaw.html"
  to = "https://unbrokenclub.com/blog/adhd-system-not-flaw.html"
  status = 301
  force = true
[[redirects]]
