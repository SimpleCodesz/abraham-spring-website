# SPA catch-all — serve index.html for all section paths, keep clean URL
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Force fresh favicon (no long cache)
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
